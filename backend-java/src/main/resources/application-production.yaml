spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

security:
  email:
    registration-confirmation:
      cleanup:
        enabled: ${REGISTRATION_CONFIRMATION_CLEANUP_ENABLED:true}

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
