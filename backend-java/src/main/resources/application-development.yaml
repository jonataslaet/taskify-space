spring:
  flyway:
    enabled: false

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  config:
    activate:
      on-profile: development

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

security:
  email:
    registration-confirmation:
      cleanup:
        enabled: ${REGISTRATION_CONFIRMATION_CLEANUP_ENABLED:false}
