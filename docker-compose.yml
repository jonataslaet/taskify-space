services:

  postgres-server:
    container_name: taskify-space-postgres-server
    image: 'postgres:18'
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - taskify-space-network

networks:
  taskify-space-network:
    driver: bridge